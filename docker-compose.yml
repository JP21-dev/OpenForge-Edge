name: openforge-edge

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        BACKEND_URL: http://backend:8000
    container_name: openforge-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [openforge-net]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: openforge-backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-30m}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-8192}
      LLM_API_KEY: ${LLM_API_KEY:-lemonade}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}
      DEEP_MODEL: ${DEEP_MODEL:-qwen3:8b}
      DEEP_THINKING: ${DEEP_THINKING:-false}
      DEEP_NUM_CTX: ${DEEP_NUM_CTX:-12288}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      EMBED_API_KEY: ${EMBED_API_KEY:-lemonade}
      VISION_PROVIDER: ${VISION_PROVIDER:-ollama}
      VISION_BASE_URL: ${VISION_BASE_URL:-http://host.docker.internal:11434}
      VISION_MODEL: ${VISION_MODEL:-qwen3-vl:4b-instruct}
      VISION_API_KEY: ${VISION_API_KEY:-lemonade}
      VISION_NUM_CTX: ${VISION_NUM_CTX:-8192}
      VISION_MAX_SIDE: ${VISION_MAX_SIDE:-1600}
      MANUALS_DIR: /app/manuals
      UPLOADS_DIR: /app/uploads
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}
      PATTERN_MIN_REPAIRS: ${PATTERN_MIN_REPAIRS:-3}
      PATTERN_SIMILARITY: ${PATTERN_SIMILARITY:-0.78}
      COVERAGE_MIN_REFERENCES: ${COVERAGE_MIN_REFERENCES:-10}
      COVERAGE_MIN_REPAIRS: ${COVERAGE_MIN_REPAIRS:-5}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.6}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-repair_manuals}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-openforge}:${MONGO_ROOT_PASSWORD:-change-me}@mongodb:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-openforge}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - ./data/manuals:/app/manuals:ro
      - uploads_data:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chromadb:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks: [openforge-net]
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:${CHROMA_VERSION:-1.5.9}
    container_name: chromadb
    ports:
      - "127.0.0.1:${CHROMA_HOST_PORT:-8001}:8000"
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb_data:/data
    networks: [openforge-net]
    restart: unless-stopped

  mongodb:
    image: mongo:${MONGO_VERSION:-8.0}
    container_name: mongodb
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-openforge}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-openforge}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [openforge-net]
    restart: unless-stopped

networks:
  openforge-net:
    name: openforge-net
    driver: bridge

volumes:
  chromadb_data:
    name: openforge_chromadb_data
  mongodb_data:
    name: openforge_mongodb_data
  uploads_data:
    name: openforge_uploads_data
